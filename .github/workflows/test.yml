name: Test
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '*' ]

jobs:
  build-image:
    name: Build test docker image if needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.calc-hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Calculate Hash
        id: calc-hash
        run: |
          # Create a combined hash of Dockerfile.test, Gemfile and Gemfile.lock
          HASH=$(sha256sum Dockerfile.test Gemfile Gemfile.lock | sha256sum | cut -c1-7)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Image Exists
        id: check-image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/ebydict-test:${{ steps.calc-hash.outputs.hash }}"
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/ebydict-test:${{ steps.calc-hash.outputs.hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run Specs
    needs: build-image
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/benyehuda-cases-server-test:${{ needs.build-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mark repository as safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Update Configuration
        run: |
          echo DATABASE_URL=mysql2://root:root@mysql:3306/tasks_test >> ./.env.test.local
      - name: Setup DB
        run: |
          bin/rails db:create RAILS_ENV=test
          bin/rails db:schema:load RAILS_ENV=test
      - name: Run Tests
        env:
          DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: "true"
        run: |
          bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb"
